<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario personal - Duvan Angel</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="contenedor">
    <h1 class="titulo">Diario personal</h1>
  </div>

  <div class="contenedor-pagina">
    <form id="form-entrada" class="formulario">
      <input type="text" id="entrada-titulo" placeholder="Título de tu entrada..." required>
      <textarea id="entrada-contenido" placeholder="Escribe aquí tu reflexión..." required></textarea>
      <button type="submit" class="boton_1">Guardar entrada</button>
    </form>

    <div id="entradas" class="lista"></div>

    <div class="botones_1">
      <a href="index.html"><button class="boton_1">Volver al menú</button></a>
    </div>
  </div>

  <script src="diario.js"></script>
</body>
</html>
